<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mouse Maze Adventure</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { text-align: center; font-family: 'Segoe UI', sans-serif; background: #e0f7fa; margin: 0; padding: 10px; touch-action: manipulation; overflow: hidden; }
        #canvas-container { margin: 10px auto; position: relative; display: inline-block; }
        canvas { border: 6px solid #455a64; background: white; border-radius: 12px; display: block; }

        #winModal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border: 5px solid #ff5722; border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3); z-index: 10; width: 250px;
        }

        .controls { display: grid; grid-template-columns: repeat(3, 75px); grid-gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { width: 75px; height: 75px; background: #ff5722; color: white; border: none; border-radius: 15px; font-size: 35px; cursor: pointer; box-shadow: 0 4px #be360b; -webkit-tap-highlight-color: transparent; }
        .btn:active { box-shadow: 0 0 #be360b; transform: translateY(4px); }

        @keyframes pulse-yellow {
            0% { background-color: #ff5722; }
            50% { background-color: #FFEB3B; box-shadow: 0 0 20px #FFEB3B; }
            100% { background-color: #ff5722; }
        }
        .hint-flash { animation: pulse-yellow 0.5s infinite; }

        .up { grid-column: 2; } .left { grid-column: 1; } .down { grid-column: 2; } .right { grid-column: 3; }

        .menu-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 5px; }
        .action-btn, select.action-select { padding: 12px 20px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; background: #4CAF50; }
        select.action-select { background: #0288d1; outline: none; -webkit-appearance: none; appearance: none; text-align: center; }
        .hint-btn { background: #FFC107 !important; color: #333 !important; }
    </style>
</head>
<body>

    <audio id="soundKey" src="key.wav" preload="auto"></audio>
    <audio id="soundCheese" src="cheese.wav" preload="auto"></audio>

    <div class="menu-bar">
        <button class="action-btn" onclick="initMaze()">Start / New Maze 🔄</button>
        <button class="action-btn hint-btn" onclick="showHint()">Hint? 💡</button>
        <select id="soundModeSelect" class="action-select" onchange="changeSoundMode(this.value)">
            <option value="quiet">🔊 Sound: Quiet</option>
            <option value="normal">🔊 Sound: Normal</option>
        </select>
        <div id="timerDisplay" class="action-btn" style="background: #37474f; cursor: default; user-select: none;">⏱️ 0s</div>
    </div>

    <div id="canvas-container">
        <canvas id="maze"></canvas>
        <div id="winModal">
            <h2>YUMMY! 🧀</h2>
            <p id="finalScore" style="font-size: 22px; font-weight: bold; color: #e65100; margin: 10px 0;"></p>
            <div id="statsSummary" style="font-size: 15px; text-align: left; margin: 10px 15px; line-height: 1.5; color: #37474f;">
                <p id="keyScore" style="margin: 4px 0; font-weight: bold;"></p>
                <p id="timeTaken" style="margin: 4px 0;"></p>
                <p id="movesSummary" style="margin: 4px 0;"></p>
                <p id="missedMoves" style="margin: 4px 0;"></p>
            </div>
            <p style="font-size: 36px; margin: 5px 0;">🐭🎉</p>
            <button class="action-btn" onclick="initMaze()">Play Again!</button>
        </div>
    </div>

    <div class="controls">
        <button id="btn-ArrowUp" class="btn up" onclick="move('ArrowUp')">▲</button>
        <button id="btn-ArrowLeft" class="btn left" onclick="move('ArrowLeft')">◀</button>
        <button id="btn-ArrowDown" class="btn down" onclick="move('ArrowDown')">▼</button>
        <button id="btn-ArrowRight" class="btn right" onclick="move('ArrowRight')">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('maze');
        const ctx = canvas.getContext('2d');
        const modal = document.getElementById('winModal');
        const gridSize = 10;
        const cellSize = 35;
        const totalSize = gridSize * cellSize;

        let grid, player, history, keys, hintPath, isShowingHint, idleTimer;
        let audioCtx = null;
        let keysFound = 0;
        let soundMode = "quiet";
        let timerInterval = null;
        let elapsedTime = 0;
        let playerMoves = 0;
        let minMoves = 0;

        function changeSoundMode(mode) {
            soundMode = mode;
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSoundEffect(type) {
            if (soundMode === 'normal') {
                const audioEl = type === 'key' ? document.getElementById('soundKey') : document.getElementById('soundCheese');
                if (audioEl) {
                    audioEl.currentTime = 0;
                    audioEl.play().catch(e => console.log(e));
                    return;
                }
            }
            if (type === 'key') {
                playBeep(1200, 0.1);
            } else if (type === 'cheese') {
                playBeep(800, 0.2);
                setTimeout(() => playBeep(1000, 0.3), 150);
            }
        }

        function playBeep(freq, duration) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function initMaze() {
            initAudio(); // Activate audio context on click
            modal.style.display = "none";
            clearHintEffects();
            if (timerInterval) clearInterval(timerInterval);
            elapsedTime = 0;
            playerMoves = 0;
            document.getElementById('timerDisplay').innerText = "⏱️ 0s";

            canvas.width = totalSize;
            canvas.height = totalSize;
            grid = []; history = []; keys = []; keysFound = 0;

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) grid.push(new Cell(r, c));
            }
            generateMaze(grid[0]);
            player = { x: 0, y: 0 };

            // Generate EXACTLY 5 keys along the path
            const path = findPathFrom(0,0);
            minMoves = path.length > 0 ? path.length - 1 : 0;
            const keyInterval = Math.floor(path.length / 6);
            for(let i = 1; i <= 5; i++) {
                let idx = i * keyInterval;
                if(path[idx] && idx < path.length - 1) {
                    keys.push({r: path[idx].r, c: path[idx].c, active: true});
                }
            }

            timerInterval = setInterval(() => {
                elapsedTime++;
                document.getElementById('timerDisplay').innerText = `⏱️ ${elapsedTime}s`;
            }, 1000);

            resetIdleTimer();
            draw();
        }

        class Cell {
            constructor(r, c) {
                this.r = r; this.c = c;
                this.walls = [true, true, true, true];
                this.visited = false;
            }
        }

        function generateMaze(current) {
            current.visited = true;
            let neighbors = getUnvisitedNeighbors(current);
            while (neighbors.length > 0) {
                let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                removeWalls(current, next);
                generateMaze(next);
                neighbors = getUnvisitedNeighbors(current);
            }
        }

        function getUnvisitedNeighbors(cell) {
            let neighbors = [];
            let { r, c } = cell;
            let d = [[-1,0],[0,1],[1,0],[0,-1]];
            d.forEach(m => {
                let nr = r + m[0], nc = c + m[1];
                if(nr>=0 && nr<gridSize && nc>=0 && nc<gridSize) {
                    let n = grid[nc + nr * gridSize];
                    if(!n.visited) neighbors.push(n);
                }
            });
            return neighbors;
        }

        function removeWalls(a, b) {
            if (a.r > b.r) { a.walls[0] = false; b.walls[2] = false; }
            else if (a.r < b.r) { a.walls[2] = false; b.walls[0] = false; }
            if (a.c > b.c) { a.walls[3] = false; b.walls[1] = false; }
            else if (a.c < b.c) { a.walls[1] = false; b.walls[3] = false; }
        }

        function findPathFrom(startX, startY) {
            let start = grid[startX + startY * gridSize];
            let end = grid[(gridSize-1) + (gridSize-1) * gridSize];
            let queue = [[start]], visited = new Set([start]);
            while(queue.length > 0) {
                let path = queue.shift();
                let last = path[path.length-1];
                if(last === end) return path;
                let potential = [{dr:-1,dc:0,w:0},{dr:0,dc:1,w:1},{dr:1,dc:0,w:2},{dr:0,dc:-1,w:3}];
                potential.forEach(p => {
                    if(!last.walls[p.w]) {
                        let next = grid[(last.c+p.dc) + (last.r+p.dr) * gridSize];
                        if(next && !visited.has(next)) {
                            visited.add(next);
                            queue.push([...path, next]);
                        }
                    }
                });
            }
            return [];
        }

        function draw() {
            ctx.clearRect(0, 0, totalSize, totalSize);
            if(isShowingHint) {
                ctx.fillStyle = "rgba(255, 235, 59, 0.4)";
                hintPath.forEach(cell => ctx.fillRect(cell.c * cellSize, cell.r * cellSize, cellSize, cellSize));
            }
            ctx.fillStyle = "#4fc3f7";
            history.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x * cellSize + cellSize/2, p.y * cellSize + cellSize/2, 4, 0, Math.PI * 2); ctx.fill();
            });
            ctx.font = "18px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            keys.forEach(k => { if(k.active) ctx.fillText("🔑", k.c * cellSize + cellSize/2, k.r * cellSize + cellSize/2); });
            ctx.strokeStyle = "#455a64"; ctx.lineWidth = 4; ctx.lineCap = "round";
            grid.forEach(cell => {
                let x = cell.c * cellSize, y = cell.r * cellSize;
                if (cell.walls[0]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y); ctx.stroke(); }
                if (cell.walls[1]) { ctx.beginPath(); ctx.moveTo(x + cellSize, y); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke(); }
                if (cell.walls[2]) { ctx.beginPath(); ctx.moveTo(x, y + cellSize); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke(); }
                if (cell.walls[3]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cellSize); ctx.stroke(); }
            });
            ctx.font = "24px serif"; ctx.fillText("🧀", (gridSize - 1) * cellSize + cellSize/2, (gridSize - 1) * cellSize + cellSize/2);
            ctx.fillText("🐭", player.x * cellSize + cellSize/2, player.y * cellSize + cellSize/2);
        }

        function move(dir) {
            if(modal.style.display === "block") return;
            initAudio(); // Ensure audio is awake
            let cell = grid[player.x + player.y * gridSize];
            let moved = false;
            if (dir === "ArrowUp" && !cell.walls[0]) { player.y--; moved = true; }
            if (dir === "ArrowRight" && !cell.walls[1]) { player.x++; moved = true; }
            if (dir === "ArrowDown" && !cell.walls[2]) { player.y++; moved = true; }
            if (dir === "ArrowLeft" && !cell.walls[3]) { player.x--; moved = true; }

            if(moved) {
                playerMoves++;
                playBeep(600, 0.05); // Step sound
                history.push({x: player.x, y: player.y});
                keys.forEach(k => {
                    if(k.active && k.r === player.y && k.c === player.x) {
                        k.active = false; keysFound++;
                        playSoundEffect('key'); // Key sound
                    }
                });
                clearHintEffects(); resetIdleTimer(); draw();
                if (player.x === gridSize - 1 && player.y === gridSize - 1) {
                    if (timerInterval) clearInterval(timerInterval);
                    playSoundEffect('cheese');
                    let missedMoves = Math.max(0, playerMoves - minMoves);
                    let baseScore = 1000;
                    let score = Math.max(0, baseScore - (elapsedTime * 5) - (missedMoves * 20) + (keysFound * 50));

                    document.getElementById('finalScore').innerText = "Score: " + score;
                    document.getElementById('keyScore').innerText = "🔑 Keys Found: " + keysFound + " / 5";
                    document.getElementById('timeTaken').innerText = "⏱️ Time: " + elapsedTime + "s";
                    document.getElementById('movesSummary').innerText = "👟 Moves: " + playerMoves + " (Min: " + minMoves + ")";
                    document.getElementById('missedMoves').innerText = "❌ Missed Moves: " + missedMoves;
                    modal.style.display = "block";
                }
            }
        }

        function showHint() {
            if(isShowingHint) return;
            hintPath = findPathFrom(player.x, player.y);
            if(hintPath.length < 2) return;
            isShowingHint = true;
            let current = hintPath[0], next = hintPath[1], btnId = "";
            if (next.r < current.r) btnId = "btn-ArrowUp";
            else if (next.r > current.r) btnId = "btn-ArrowDown";
            else if (next.c < current.c) btnId = "btn-ArrowLeft";
            else if (next.c > current.c) btnId = "btn-ArrowRight";
            if(btnId) document.getElementById(btnId).classList.add('hint-flash');
            draw();
            setTimeout(() => { clearHintEffects(); draw(); }, 3000);
            resetIdleTimer();
        }

        function clearHintEffects() {
            isShowingHint = false;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('hint-flash'));
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => { if(modal.style.display !== "block") showHint(); }, 20000);
        }

        window.addEventListener('keydown', e => move(e.key));
        initMaze();
    </script>
</body>
</html>
